name: Refresh data

on:
  schedule:
    # Nightly; fetchers are network-bound and may fail per source.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Partial failures are expected (a source may be down); keep the snapshots
      # that did refresh and report the rest.
      - name: Ingest source snapshots
        continue-on-error: true
        run: npm run ingest --workspace server 2>&1 | tee /tmp/ingest.log

      - name: Source health
        if: always()
        run: |
          {
            echo "### Source health"
            echo ""
            if [ -s /tmp/ingest.log ]; then
              echo "- refreshed: $(grep -c '^✓' /tmp/ingest.log || true)"
              echo "- failed: $(grep -c '^✗' /tmp/ingest.log || true)"
              echo ""
              grep '^✗' /tmp/ingest.log || echo "_no failures_"
            else
              echo "_no ingest log_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build dataset
        run: npm run build:data

      # Source coverage + dataset invariants; a broken dataset is not committed.
      - name: Validate dataset
        run: npm run test

      - name: Commit updated snapshots
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore(data): refresh source snapshots"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN do not trigger workflows, so start CI
      # explicitly; it rebuilds the images and freshdock deploys them.
      - name: Rebuild images
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref main
