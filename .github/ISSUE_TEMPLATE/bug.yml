name: Bug report
description: Something in the site or API is broken
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Page URL or API endpoint (e.g. https://unrom.com/devices, GET /api/roms)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / client (optional)
      placeholder: Firefox 130, curl 8, …
    validations:
      required: false
