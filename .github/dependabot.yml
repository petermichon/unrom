version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Group only safe bumps; major versions arrive as separate PRs to review
    # individually (a single major that breaks CI shouldn't block the rest).
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The runtime is pinned intentionally (CI tests 22.18/24); bump Node by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
