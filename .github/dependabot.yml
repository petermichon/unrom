version: 2
updates:
  # Group safe (minor/patch) bumps to cut noise; major versions arrive as
  # separate PRs so one breaking bump can't block the rest.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # TanStack Table v9 is a breaking migration; revisit deliberately.
    # eslint 10 / TypeScript 7 are ahead of the peer graph: eslint-plugin-jsx-a11y
    # caps at eslint 9 and typescript-eslint at TypeScript <6.1. Upgrade once they
    # catch up.
    ignore:
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The runtime is pinned intentionally (CI tests 22.18/24); bump Node by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
