version: 2
updates:
  # Group safe (minor/patch) bumps to cut noise; major versions arrive as
  # separate PRs so one breaking bump can't block the rest.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The runtime is pinned intentionally (CI tests 22.18/24); bump Node by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
