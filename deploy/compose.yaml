# unrom — self-hosted deployment.
#
#   docker compose -f deploy/compose.yaml up -d --build            # build locally
#   docker compose -f deploy/compose.yaml --profile proxy up -d    # + bundled Caddy
#
# Images are immutable: CI builds the dataset into the API image, so a deploy is
# just `pull` + `up -d`. The API serves the built SQLite/JSON from the image.
#
# `--profile deploy` adds freshdock, which updates the stack by pulling new
# images from the registry (no inbound access, no SSH credentials). Give it a
# writable Docker socket; healthchecks gate updates and enable rollback.

name: unrom

services:
  api:
    image: ${UNROM_REGISTRY:-ghcr.io/petermichon}/unrom-api:${UNROM_TAG:-latest}
    build:
      context: ..
      target: api
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "freshdock.enable=true"
      - "freshdock.mode=live"
    restart: unless-stopped

  web:
    image: ${UNROM_REGISTRY:-ghcr.io/petermichon}/unrom-web:${UNROM_TAG:-latest}
    build:
      context: ..
      target: web
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      # Server-side loaders call the API over the compose network.
      API_URL: http://api:3000
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - api
    labels:
      - "freshdock.enable=true"
      - "freshdock.mode=live"
    restart: unless-stopped

  # Optional bundled reverse proxy. Skip it if the host already runs one.
  caddy:
    image: caddy:2
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

  # Pull-based auto-updater (opt-in): recreates api/web when a new image is
  # published. Needs a writable Docker socket.
  freshdock:
    image: ghcr.io/turbootzz/freshdock:latest
    profiles: ["deploy"]
    command: ["run"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "freshdock.mode=off"
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
